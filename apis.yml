apis:
- name: Angstrom API
  description: >-
    Decentralized JSON-RPC + WebSocket API for the Angstrom DEX. Every Angstrom
    node runs its own JSON-RPC server (there is no single central API); a
    load-balanced HTTPS/WebSocket endpoint is recommended for high availability,
    with direct low-latency node endpoints and a separate on-chain Data API also
    available. Endpoint categories: Trading (order submission, cancellation,
    status, retrieval), Gas Estimation, WebSocket Streams (live order updates),
    Exchange metadata (token pairs, token registry, pool keys, pool config), and
    Liquidity positions.
  humanURL: https://docs.angstrom.xyz/api/intro
  baseURL: https://mainnet.node-lb.angstrom.xyz
