name: Sorella Labs
description: >-
  Sorella Labs is a crypto-infrastructure company building Angstrom, a new kind
  of decentralized exchange (DEX) built on top of Uniswap V4 that internalizes
  MEV through application-level sequencing. By enforcing its own transaction
  ordering, Angstrom redirects value that would normally be extracted by MEV
  bots and validators back to the actual participants — liquidity providers and
  swappers. The company also builds Brontes, a Rust blockchain-analytics engine
  specialized in systematic MEV detection. Angstrom exposes a decentralized
  JSON-RPC API — each node runs its own JSON-RPC server, with a recommended
  load-balanced HTTPS/WebSocket endpoint plus a separate on-chain Data API — and
  ships Rust libraries (angstrom-sdk, angstrom-v4) for integrators, routers, and
  solvers. Backed by Paradigm.
